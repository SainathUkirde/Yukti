services:
  - type: web
    name: yukti
    runtime: python
    plan: free
    rootDir: .
    buildCommand: bash build.sh
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NUM_WELLS
        value: 5
      - key: TIME_ACCELERATION
        value: 10
      - key: TICK_INTERVAL_S
        value: 1.5
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.11.9
